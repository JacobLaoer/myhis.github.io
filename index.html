<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="查房笔记"/>
<meta name="theme-color" content="#f4f6f9"/>
<title>查房笔记</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.svg"/>
<script>
  (function () {
    try {
      var saved = localStorage.getItem('ward_theme');
      if (saved === 'dark') {
        document.documentElement.classList.add('theme-dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#161412');
      }
    } catch (e) {}
  })();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&display=swap');

:root {
  --bg: #f4f6f9;
  --bg2: #ffffff;
  --bg3: #eef1f5;
  --bg4: #e3e8ef;
  --border: rgba(31,45,61,0.08);
  --border2: rgba(31,45,61,0.16);
  --text: #24303e;
  --text2: #64748b;
  --text3: #94a3b8;
  --accent: #2563eb;
  --accent-bg: rgba(37,99,235,0.1);
  --red: #dc4b5c;
  --red-bg: rgba(220,75,92,0.1);
  --amber: #b7791f;
  --amber-bg: rgba(183,121,31,0.12);
  --green: #2f9e66;
  --green-bg: rgba(47,158,102,0.12);
  --radius: 14px;
  --radius-sm: 9px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font-size: 15px;
}

html.theme-dark {
  color-scheme: dark;
  --bg: #161412;
  --bg2: #201d1a;
  --bg3: #2a2621;
  --bg4: #353029;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.15);
  --text: #ece7df;
  --text2: #aaa29a;
  --text3: #6f685f;
  --accent: #e8a33d;
  --accent-bg: rgba(232,163,61,0.14);
  --red: #ef6b6b;
  --red-bg: rgba(239,107,107,0.13);
  --amber: #e0a840;
  --amber-bg: rgba(224,168,64,0.13);
  --green: #63c48d;
  --green-bg: rgba(99,196,141,0.13);
}

html { color-scheme: light; }

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
}

/* ── Layout ── */
.app-wrap {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

.status-bar-fill {
  height: var(--safe-top);
  background: var(--bg);
}

/* ── Header ── */
.app-header {
  padding: 14px 18px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg);
  border-bottom: 0.5px solid var(--border);
  position: sticky;
  top: var(--safe-top);
  z-index: 50;
}
.app-logo {
  display: flex;
  align-items: center;
  gap: 9px;
}
.app-logo-mark {
  width: 30px; height: 30px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}
.app-logo-mark svg { width: 16px; height: 16px; }
.app-logo-name { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
.app-logo-sub { font-size: 11px; color: var(--text2); margin-top: 1px; }
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.icon-btn {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg3);
  color: var(--text2);
  border: 0.5px solid var(--border2);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: inherit;
}
.icon-btn:active { background: var(--bg4); }
.theme-toggle .icon-moon { display: none; }
html.theme-dark .theme-toggle .icon-sun { display: none; }
html.theme-dark .theme-toggle .icon-moon { display: block; }
.add-bed-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 7px 13px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
}
.add-bed-btn:active { transform: scale(0.96); }

/* ── Tab Bar ── */
.tab-bar {
  display: flex;
  padding: 0 18px;
  gap: 2px;
  background: var(--bg);
  border-bottom: 0.5px solid var(--border);
}
.tab-item {
  flex: 1;
  padding: 10px 8px;
  font-size: 12px;
  text-align: center;
  color: var(--text2);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.15s;
  user-select: none;
}
.tab-item.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 500;
}

/* ── View Switch ── */
.view-switch {
  display: flex;
  gap: 3px;
  margin: 12px 18px 0;
  padding: 3px;
  background: var(--bg2);
  border: 0.5px solid var(--border);
  border-radius: 10px;
}
.view-switch-btn {
  flex: 1;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: 7px;
  color: var(--text2);
  cursor: pointer;
  font-family: inherit;
}
.view-switch-btn.active {
  background: var(--bg3);
  color: var(--accent);
}
.view-switch-btn svg { width: 15px; height: 15px; }

/* ── Stats ── */
.stats-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 10px;
  padding: 14px 18px;
}
.stat-card {
  background: var(--bg2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
}
.stat-label { font-size: 11px; color: var(--text2); margin-bottom: 5px; }
.stat-value { font-size: 24px; font-weight: 600; }

/* ── Bed Cards ── */
.bed-list { padding: 0 18px 120px; }

.bed-card {
  background: var(--bg2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
  transition: border-color 0.2s;
}
.bed-card.risk-r { border-left: 3px solid var(--red); }
.bed-card.risk-y { border-left: 3px solid var(--amber); }
.bed-card.risk-g { border-left: 3px solid var(--green); }

.compact-item { margin-bottom: 6px; break-inside: avoid; }
.compact-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg2);
  border: 0.5px solid var(--border);
  border-left: 3px solid var(--amber);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  cursor: pointer;
  user-select: none;
}
.compact-row.risk-r { border-left-color: var(--red); }
.compact-row.risk-g { border-left-color: var(--green); }
.compact-row.open { border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
.compact-avatar {
  width: 34px; height: 34px;
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  flex-shrink: 0;
}
.compact-main { flex: 1; min-width: 0; }
.compact-line1 { display: flex; align-items: baseline; gap: 6px; }
.compact-num { font-size: 11px; color: var(--text2); }
.compact-name { font-size: 14px; font-weight: 600; }
.compact-line2 {
  font-size: 11px; color: var(--text2); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.compact-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.compact-detail {
  background: var(--bg2);
  border: 0.5px solid var(--border);
  border-top: none;
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  overflow: hidden;
}
.drag-handle {
  width: 26px;
  height: 26px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: 6px;
  color: var(--text3);
  cursor: grab;
  touch-action: none;
  font-family: inherit;
  padding: 0;
}
.drag-handle:active { cursor: grabbing; background: var(--bg4); }
.drag-handle svg { width: 14px; height: 14px; }
.bed-card.dragging, .compact-item.dragging { opacity: 0.55; }
.bed-card.dragging { outline: 1.5px dashed var(--accent); }
.compact-item.dragging .compact-row { outline: 1.5px dashed var(--accent); }

.bed-header {
  display: flex; align-items: center; gap: 11px;
  padding: 13px 15px;
  cursor: pointer;
  user-select: none;
}
.bed-avatar {
  width: 38px; height: 38px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600;
  flex-shrink: 0;
}
.avatar-r { background: var(--red-bg); color: var(--red); }
.avatar-y { background: var(--amber-bg); color: var(--amber); }
.avatar-g { background: var(--green-bg); color: var(--green); }

.bed-meta { flex: 1; min-width: 0; }
.bed-name-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.bed-num { font-size: 11px; color: var(--text2); }
.bed-name { font-size: 15px; font-weight: 600; }
.bed-info-row { font-size: 12px; color: var(--text2); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
.bed-chief { font-size: 12px; color: var(--text2); margin-top: 3px; line-height: 1.5; }
.bed-chief b { color: var(--text); font-weight: 500; }
.day-badge {
  font-size: 11px; font-weight: 600;
  background: var(--accent-bg); color: var(--accent);
  padding: 2px 7px; border-radius: 20px;
}
.chevron-btn {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg3); border-radius: 8px;
  flex-shrink: 0;
  transition: transform 0.2s;
}
.chevron-btn.open { transform: rotate(90deg); }
.chevron-btn svg { width: 14px; height: 14px; }

/* ── Today Section ── */
.bed-today {
  padding: 0 15px 13px;
  border-top: 0.5px solid var(--border);
}
.section-mini-label {
  font-size: 10px; font-weight: 600;
  color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.08em;
  margin: 11px 0 6px;
}
.remark-pill {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--amber-bg); color: var(--amber);
  font-size: 11px; padding: 3px 9px;
  border-radius: 20px; margin-bottom: 8px;
}
.today-condition {
  font-size: 13px; line-height: 1.65;
  color: var(--text);
}
.order-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.order-chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--amber-bg); color: var(--amber);
  font-size: 11px; padding: 3px 9px;
  border-radius: 20px; cursor: pointer;
  transition: background 0.15s, color 0.15s;
  user-select: none;
}
.order-chip.done {
  background: var(--green-bg); color: var(--green);
  text-decoration: line-through; opacity: 0.75;
}
.bed-actions { display: flex; gap: 7px; margin-top: 11px; flex-wrap: wrap; }
.action-btn {
  padding: 6px 12px; font-size: 12px; font-weight: 500;
  border: 0.5px solid var(--border2);
  border-radius: var(--radius-sm);
  background: var(--bg3); color: var(--text);
  cursor: pointer; font-family: inherit;
  transition: background 0.15s;
}
.action-btn:active { background: var(--bg4); }
.action-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.action-btn.primary:active { opacity: 0.85; }
.empty-today {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 0;
}
.empty-today-text { font-size: 13px; color: var(--text3); }

/* ── Timeline ── */
.tl-section { display: none; border-top: 0.5px solid var(--border); }
.tl-section.open { display: block; }
.tl-inner-label {
  font-size: 10px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.08em;
  padding: 10px 15px 4px;
}
.tl-entry { display: flex; gap: 10px; padding: 10px 15px; border-bottom: 0.5px solid var(--border); }
.tl-entry:last-child { border-bottom: none; }
.tl-left { width: 42px; flex-shrink: 0; text-align: center; }
.tl-day { font-size: 12px; font-weight: 600; }
.tl-date { font-size: 10px; color: var(--text3); margin-top: 1px; }
.tl-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border2); margin: 5px auto 0; }
.tl-dot.today { background: var(--accent); }
.tl-content { flex: 1; min-width: 0; }
.tl-time { font-size: 11px; color: var(--text3); margin-bottom: 3px; }
.tl-text { font-size: 13px; line-height: 1.6; color: var(--text); white-space: pre-wrap; }
.tl-orders { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.tl-entry-actions { display: flex; gap: 10px; margin-top: 6px; }
.tl-mini-btn { background: transparent; border: none; padding: 0; color: var(--text2); font-size: 11px; cursor: pointer; font-family: inherit; }
.tl-mini-btn.danger { color: var(--red); }
.tl-actions { display: flex; gap: 7px; padding: 10px 15px; border-top: 0.5px solid var(--border); }
.tl-add-row {
  display: flex; align-items: center; gap: 7px;
  padding: 9px 15px; font-size: 12px; color: var(--text2);
  cursor: pointer; border-top: 0.5px solid var(--border);
  background: transparent; border-left: none; border-right: none; border-bottom: none;
  width: 100%; font-family: inherit;
}

/* ── Export Tab ── */
.export-list { padding: 0 18px 120px; }
.export-card {
  background: var(--bg2); border: 0.5px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
  margin-bottom: 10px; cursor: pointer;
  transition: border-color 0.15s;
}
.export-card:active { border-color: var(--border2); }
.export-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.export-card-name { font-size: 14px; font-weight: 600; }
.export-card-meta { font-size: 12px; color: var(--text2); }
.export-card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
.export-section-label {
  font-size: 11px; color: var(--text2);
  text-transform: uppercase; letter-spacing: 0.06em;
  padding: 10px 18px 4px;
}
.no-record-card {
  background: var(--bg2); border: 0.5px solid var(--border);
  border-radius: var(--radius); padding: 12px 15px;
  margin-bottom: 8px; display: flex; align-items: center; gap: 10px;
}
.no-record-info { flex: 1; }
.no-record-name { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
.no-record-sub { font-size: 12px; color: var(--text2); }

/* ── Todo Tab ── */
.todo-list { padding: 14px 18px 120px; }
.todo-card {
  display: flex; align-items: flex-start; gap: 10px;
  background: var(--bg2); border: 0.5px solid var(--border);
  border-left: 3px solid var(--amber); border-radius: var(--radius-sm);
  padding: 12px 14px; margin-bottom: 8px;
}
.todo-card.risk-r { border-left-color: var(--red); }
.todo-card.risk-g { border-left-color: var(--green); }
.todo-main { flex: 1; min-width: 0; }
.todo-text { font-size: 13px; line-height: 1.5; color: var(--text); }
.todo-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; font-size: 11px; color: var(--text2); }
.todo-date { margin-left: auto; font-size: 11px; color: var(--text3); white-space: nowrap; }

/* ── Backup & Batch Export ── */
.backup-section { margin: 14px 18px 0; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.backup-title { font-size: 12px; font-weight: 600; margin-bottom: 10px; }
.backup-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.backup-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  min-width: calc(50% - 4px); flex: 1;
  padding: 10px 12px;
  background: var(--bg3); color: var(--text);
  border: 0.5px solid var(--border2);
  border-radius: var(--radius-sm); font-size: 12px;
  font-family: inherit; cursor: pointer;
}
.backup-btn:active { background: var(--bg4); }
.backup-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.import-file { display: none; }

/* ── Tags ── */
.tag {
  display: inline-block; font-size: 11px; font-weight: 500;
  padding: 2px 8px; border-radius: 20px;
}
.tag-r { background: var(--red-bg); color: var(--red); }
.tag-y { background: var(--amber-bg); color: var(--amber); }
.tag-g { background: var(--green-bg); color: var(--green); }
.tag-b { background: var(--accent-bg); color: var(--accent); }
.tag-gray { background: var(--bg3); color: var(--text2); }

/* ── Modal ── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-sheet {
  background: var(--bg2);
  border-radius: var(--radius) var(--radius) 0 0;
  width: 100%; max-width: 430px;
  max-height: 92dvh;
  overflow-y: auto;
  padding: 0 0 calc(16px + var(--safe-bottom));
}
.modal-handle {
  width: 36px; height: 4px;
  background: var(--border2); border-radius: 2px;
  margin: 10px auto 0;
}
.modal-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px 10px;
  border-bottom: 0.5px solid var(--border);
}
.modal-title { font-size: 16px; font-weight: 600; }
.modal-close {
  width: 28px; height: 28px;
  background: var(--bg3); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text2); font-size: 16px;
  border: none; font-family: inherit;
}
.modal-body { padding: 16px 18px; }
.form-row { margin-bottom: 13px; }
.form-label { font-size: 12px; color: var(--text2); margin-bottom: 5px; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 10px 12px;
  background: var(--bg3); color: var(--text);
  border: 0.5px solid var(--border2);
  border-radius: var(--radius-sm);
  font-size: 14px; font-family: inherit;
  outline: none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--accent);
}
.form-textarea { resize: none; line-height: 1.55; }
.form-textarea::placeholder, .form-input::placeholder { color: var(--text3); }
.form-date-row { display: flex; gap: 8px; }
.form-date-row .form-input { flex: 1; }
.form-date-row .form-input.time-input { width: 80px; flex: none; }
.form-hint { font-size: 11px; color: var(--text3); margin-top: 4px; }
.form-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-bottom: 13px; }
.form-grid-2 .form-row { margin-bottom: 0; }
.form-btn {
  width: 100%; padding: 13px;
  background: var(--accent); color: #fff;
  border: none; border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 600; font-family: inherit;
  cursor: pointer; margin-bottom: 8px;
}
.form-btn:active { opacity: 0.85; }
.form-btn.danger { background: var(--red-bg); color: var(--red); }

/* ── Export Detail Modal ── */
.export-section { padding: 14px 18px; border-bottom: 0.5px solid var(--border); }
.export-section-title {
  font-size: 11px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px;
}
.export-progress-box {
  background: var(--bg3); border-radius: var(--radius-sm);
  padding: 13px; font-size: 13px; line-height: 1.7;
  color: var(--text); white-space: pre-wrap;
}
.copy-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; padding: 10px;
  background: var(--bg3); color: var(--text);
  border: 0.5px solid var(--border2);
  border-radius: var(--radius-sm); font-size: 13px;
  cursor: pointer; font-family: inherit; margin-top: 10px;
}
.copy-btn:active { background: var(--bg4); }
.order-check-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 0.5px solid var(--border);
}
.order-check-row:last-child { border-bottom: none; }
.check-box {
  width: 20px; height: 20px; flex-shrink: 0;
  border: 1.5px solid var(--border2); border-radius: 6px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.check-box.checked { background: var(--green); border-color: var(--green); }
.check-icon { width: 11px; height: 11px; opacity: 0; transition: opacity 0.1s; }
.check-box.checked .check-icon { opacity: 1; }
.order-text-label { flex: 1; font-size: 13px; }
.order-text-label.done { text-decoration: line-through; color: var(--text3); }

/* ── Empty ── */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 14px; }
.empty-icon { font-size: 32px; margin-bottom: 10px; opacity: 0.4; }

@media (min-width: 900px) {
  .app-header { padding: 14px 24px 10px; }
  .tab-bar { padding: 0 24px; }
  .stats-row { padding: 16px 24px; grid-template-columns: repeat(4, minmax(0,1fr)); }
  .bed-list, .export-list, .todo-list {

  .bed-list > .empty-state, .export-list > .empty-state, .todo-list > .empty-state { grid-column: 1 / -1; }
  .bed-card, .export-card, .no-record-card { margin-bottom: 0; }
  .modal-sheet { max-width: 560px; }
  .backup-section { margin: 16px 24px 0; }
  .view-switch { margin: 16px 24px 0; }
  .export-section-label { padding: 12px 24px 6px; }
}

@media (max-width: 360px) {

  .tab-bar { padding: 0 14px; }
  .stats-row { padding: 12px 14px; }
  .bed-list, .export-list, .todo-list { padding: 0 14px 100px; }

  .view-switch { margin: 12px 14px 0; }
}

<script>
const STORAGE_KEY = 'ward_data_v1';
const THEME_KEY = 'ward_theme';

function localDateStr(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
let TODAY = localDateStr(new Date());
let currentTab = 'beds';
let importMode = 'merge';
let viewMode = 'standard';

function toggleTheme(){
  const dark = document.documentElement.classList.toggle('theme-dark');
  try{ localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light'); }catch(e){}
  document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#161412' : '#f4f6f9');
}

function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify({beds,expanded:[...expanded],viewMode}));}
function normalizeBed(b){
  if(!b || typeof b !== 'object') return {age:'', gender:'', chief:'', entries:[]};
  return {
    age:'', gender:'', chief:'', entries:[], order:null,
    ...b,
    order:b.order!=null?b.order:numericBed(b.num),
    entries:(Array.isArray(b.entries)?b.entries:[]).map(e=>({orders:[],...e,orders:Array.isArray(e.orders)?e.orders:[]}))
  };
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
    if(d.beds) beds=d.beds.map(normalizeBed);
    if(d.expanded) d.expanded.forEach(id=>expanded.add(id));
    if(d.viewMode && ['compact','standard','expanded'].includes(d.viewMode)) viewMode=d.viewMode;
  }catch(e){}
}

function fmtDate(d){if(!d)return'';const p=d.split('-');return p[1]+'/'+p[2];}
function dayN(admit,entry){return Math.max(1,Math.round((new Date(entry)-new Date(admit))/864e5)+1);}
function daysSince(d){return d?Math.max(1,Math.round((new Date(TODAY)-new Date(d))/864e5)+1):1;}

let beds = [];
let expanded = new Set();
let noteTarget = {bedId:null, entryId:null};
let exportBedId = null;

load();

function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}

function showTab(t,el){
  currentTab=t;
  document.querySelectorAll('.tab-item').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-beds').style.display = t==='beds'?'block':'none';
  document.getElementById('tab-export').style.display = t==='export'?'block':'none';
  document.getElementById('tab-todo').style.display = t==='todo'?'block':'none';
  if(t==='export') renderExport();
  if(t==='todo') renderTodo();
}

function setViewMode(mode){
  viewMode=mode;
  save();
  syncViewSwitch();
  renderAll();
}
function syncViewSwitch(){
  document.querySelectorAll('.view-switch-btn').forEach(b=>b.classList.toggle('active', b.dataset.mode===viewMode));
}

function riskCls(r){return{r:'risk-r',y:'risk-y',g:'risk-g'}[r];}
function riskAvatarCls(r){return{r:'avatar-r',y:'avatar-y',g:'avatar-g'}[r];}
function riskLabel(r){return{r:'重点关注',y:'常规随访',g:'维护观察'}[r];}
function riskTagCls(r){return{r:'tag-r',y:'tag-y',g:'tag-g'}[r];}
function riskSort(a,b){return{r:0,y:1,g:2}[a.risk]-{r:0,y:1,g:2}[b.risk];}
function numericBed(num){
  const m=String(num||'').match(/^(\d+)/);
  return m?parseInt(m[1],10):Number.MAX_SAFE_INTEGER;
}
function bedNumLabel(num){
  return String(num||'?').slice(0,3);
}
function bedSort(a,b){
  const ao=a.order!=null?Number(a.order):numericBed(a.num);
  const bo=b.order!=null?Number(b.order):numericBed(b.num);
  if(ao!==bo) return ao-bo;
  const an=numericBed(a.num), bn=numericBed(b.num);
  if(an!==bn) return an-bn;
  return String(a.num||'').localeCompare(String(b.num||''));
}

function totalPending(){
  let n=0;
  beds.forEach(b=>b.entries.forEach(e=>e.orders.forEach(o=>{if(!o.done)n++;})));
  return n;
}

function updateStats(){
  document.getElementById('stat-beds').textContent=beds.length;
  const n=totalPending();
  document.getElementById('stat-orders').textContent=n;
  document.getElementById('export-badge').textContent=n>0?`(${n})`:'';
  document.getElementById('todo-badge').textContent=n>0?`(${n})`:'';
}

function todaySectionHtml(b,today){
  if(!today) return `<div class="empty-today">
    <span class="empty-today-text">今日暂未记录</span>
    <div style="display:flex;gap:7px;">
      <button class="action-btn primary" onclick="openNoteNew(${b.id},event)">+ 查房笔记</button>
      <button class="action-btn" onclick="openExport(${b.id},event)">导出病程</button>
    </div>
  </div>`;
  return `<div class="today-condition">${escHtml(today.condition)}</div>
    ${today.orders.length?`<div class="order-chips">${today.orders.map((o,oi)=>`<span class="order-chip${o.done?' done':''}" onclick="toggleOrder(${b.id},${today.id},${oi},event)">${o.done?'✓ ':''}${escHtml(o.text)}</span>`).join('')}</div>`:''}
    <div class="bed-actions">
      <button class="action-btn" onclick="openNoteEdit(${b.id},${today.id},event)">编辑笔记</button>
      <button class="action-btn" onclick="openExport(${b.id},event)">导出病程</button>
    </div>`;
}

function timelineHtml(b,isOpen){
  const sortedEntries=[...b.entries].sort((a,c)=>a.date>c.date?-1:1);
  const tlRows=sortedEntries.map(e=>{
    const isToday=e.date===TODAY;
    const dn=dayN(b.admitDate,e.date);
    const chips=e.orders.map((o,oi)=>`
      <span class="order-chip${o.done?' done':''}" onclick="toggleOrder(${b.id},${e.id},${oi},event)">
        ${o.done?'✓ ':''}${escHtml(o.text)}
      </span>`).join('');
    return `<div class="tl-entry">
      <div class="tl-left">
        <div class="tl-day" style="${isToday?'color:var(--accent);':''}">${dn}天</div>
        <div class="tl-date">${fmtDate(e.date)}</div>
        <div class="tl-dot${isToday?' today':''}"></div>
      </div>
      <div class="tl-content">
        <div class="tl-time">${escHtml(e.time||'')}${isToday?` <span style="color:var(--accent);font-size:10px;font-weight:600;">今日</span>`:''}</div>
        <div class="tl-text">${escHtml(e.condition)}</div>
        ${e.orders.length?`<div class="tl-orders">${chips}</div>`:''}
        ${!isToday?`<div class="tl-entry-actions"><button class="tl-mini-btn" onclick="openNoteEdit(${b.id},${e.id},event)">编辑</button><button class="tl-mini-btn danger" onclick="deleteNote(${b.id},${e.id},event)">删除</button></div>`:''}
      </div>
    </div>`;
  }).join('');
  return `<div class="tl-section${isOpen?' open':''}">
    <div class="tl-inner-label">住院病程（${b.entries.length}条）</div>
    ${tlRows}
    <button class="tl-add-row" onclick="openNoteNew(${b.id},event)">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.2"/><path d="M7 4v6M4 7h6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      补充历史病程记录
    </button>
    <div class="tl-actions">
      <button class="action-btn" style="flex:1;" onclick="openEditBed(${b.id},event)">编辑信息</button>
      <button class="action-btn" style="flex:1;color:var(--red);border-color:var(--red-bg);" onclick="deleteBed(${b.id},event)">删除患者</button>
    </div>
  </div>`;
}

function bedDetailHtml(b,today,isOpen){
  return `<div class="bed-today">
    ${b.remark?`<div class="remark-pill"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.2"/><path d="M6 5v3M6 3.5v.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>${escHtml(b.remark)}</div>`:''}
    <div class="section-mini-label">今日病情</div>
    ${todaySectionHtml(b,today)}
  </div>${timelineHtml(b,isOpen)}`;
}

function renderBeds(){
  const sorted=[...beds].sort(bedSort);
  const el=document.getElementById('bed-list');
  if(!beds.length){
    el.innerHTML=`<div class="empty-state"><div class="empty-icon">🏥</div><div>点击右上角「新增患者」开始管理床位</div></div>`;
    return;
  }

let dragState=null;
function startDrag(e,id){
  if(e.cancelable) e.preventDefault();
  e.stopPropagation();
  const el=e.currentTarget.closest('.bed-card, .compact-item');
  if(!el) return;
  dragState={id, el, startX:e.clientX, startY:e.clientY, moved:false};
  el.classList.add('dragging');
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
}
function moveDrag(e){
  if(!dragState) return;
  if(e.cancelable) e.preventDefault();
  const d=Math.abs(e.clientX-dragState.startX)+Math.abs(e.clientY-dragState.startY);
  if(!dragState.moved && d<6) return;
  dragState.moved=true;
  const container=dragState.el.parentElement;
  const under=document.elementFromPoint(e.clientX,e.clientY);
  const target=under&&under.closest('.bed-card, .compact-item');
  if(target && target!==dragState.el && container===target.parentElement){
    const r=target.getBoundingClientRect();
    if(e.clientY<r.top+r.height/2) container.insertBefore(dragState.el,target);
    else container.insertBefore(dragState.el,target.nextSibling);
  }
}
function endDrag(e){
  if(!dragState) return;
  const el=dragState.el;
  el.classList.remove('dragging');
  try{ el.releasePointerCapture(e.pointerId); }catch(err){}
  if(dragState.moved){
    const container=el.parentElement;
    const ids=[...container.querySelectorAll('.bed-card, .compact-item')].map(x=>Number(x.dataset.id));
    const byId=new Map(beds.map(b=>[b.id,b]));
    beds=ids.map(id=>byId.get(id)).filter(Boolean);
    beds.forEach((b,i)=>{ b.order=i+1; });
    save(); renderAll();
  }
  dragState=null;
}
document.addEventListener('pointermove', moveDrag);
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

  const raw=document.getElementById('n-orders-raw').value.trim();
  const newOrders=raw?raw.split('\n').filter(x=>x.trim()).map(t=>({text:t.trim(),done:false})):[];
  if(entryId){
    const entry=b.entries.find(x=>x.id===entryId);
    const prevDone={};
    entry.orders.forEach(o=>{if(o.done)prevDone[o.text]=true;});
    entry.date=date; entry.time=time; entry.condition=condition;
    entry.orders=newOrders.map(o=>({text:o.text,done:!!prevDone[o.text]}));

    b.entries.push({id:Date.now(),date,time,condition,orders:newOrders});

function downloadFile(name,content,type){
  const blob=new Blob([content],{type:type||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

function importFromFile(){
  const input=document.getElementById('import-file');
  const file=input.files&&input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const d=JSON.parse(reader.result);
      if(!d||!Array.isArray(d.beds)) throw new Error('不是有效的备份文件');
      const incoming=d.beds.map(normalizeBed);
      if(importMode==='overwrite'){
        beds=incoming;
        expanded=new Set(Array.isArray(d.expanded)?d.expanded:[]);
      }else{
        const byId=new Map(beds.map(b=>[b.id,b]));
        incoming.forEach(nb=>{
          const old=byId.get(nb.id);
          if(!old){
            beds.push(nb);
            byId.set(nb.id,nb);
          }else{
            const seen=new Set(old.entries.map(e=>e.id));
            nb.entries.forEach(ne=>{ if(!seen.has(ne.id)){ old.entries.push(ne); seen.add(ne.id); } });
            ['num','name','age','gender','diag','chief','risk','admitDate','remark'].forEach(k=>{ if(nb[k]) old[k]=nb[k]; });
          }
        });
        (d.expanded||[]).forEach(id=>expanded.add(id));
      }
      save(); renderAll(); renderExport(); renderTodo();
      alert('导入成功');
    }catch(err){
      alert('导入失败：'+(err&&err.message?err.message:'文件无法读取'));
    }
    input.value='';
  };
  reader.readAsText(file,'utf-8');
}

function buildFullProgressText(b){
  const lines=[];
  const who=[b.num+'床',b.name].filter(Boolean).join(' ');
  const meta=[b.age?b.age+'岁':null,b.gender,b.diag].filter(Boolean).join(' · ');
  lines.push(who+(meta?'（'+meta+'）':''));
  if(b.chief) lines.push('主诉：'+b.chief);
  lines.push('入院日期：'+(b.admitDate?b.admitDate.replace(/-/g,'/')+'（入院第'+daysSince(b.admitDate)+'天）':'未知'));
  if(b.risk) lines.push('风险等级：'+(riskLabel(b.risk)||'未设置'));
  if(b.remark) lines.push('备注：'+b.remark);
  const entries=[...b.entries].sort((a,c)=>a.date<c.date?-1:a.date>c.date?1:0);
  if(!entries.length){
    lines.push('');
    lines.push('（暂无查房记录）');
  }else{
    entries.forEach(e=>{
      const dn=dayN(b.admitDate,e.date);
      const ds=e.date.replace(/-/g,'/');
      lines.push('');
      lines.push(`第${dn}天（${ds}${e.time?' '+e.time:''}）`);
      lines.push('【病情变化】');
      lines.push(e.condition||'（无）');
      if(e.orders.length){
        lines.push('【处理】');
        e.orders.forEach(o=>lines.push((o.done?'[已执行] ':'[待执行] ')+o.text));
      }
    });
  }
  return lines.join('\n');
}
function buildProgressText(b,entry,dn){
  if(!entry)return'（今日暂无查房记录）';
  const ds=entry.date.replace(/-/g,'/');
  const ordersText=entry.orders.length
    ?'\n\n【处理】\n'+entry.orders.map(o=>(o.done?'[已执行] ':'[待执行] ')+o.text).join('\n')
    :'';
  return `入院第${dn}天（${ds}${entry.time?' '+entry.time:''}）\n\n【病情变化】\n${entry.condition}${ordersText}`;
}
function copyText(id,btn){
  const text=document.getElementById(id).textContent;
  navigator.clipboard&&navigator.clipboard.writeText(text).then(()=>{
    const old=btn.innerHTML;
    btn.textContent='已复制 ✓';
    setTimeout(()=>{btn.innerHTML=old;},1800);
  });
}

function renderExport(){
  const sorted=[...beds].sort(riskSort);
  const withRecord=sorted.filter(b=>b.entries.find(e=>e.date===TODAY));
  const noRecord=sorted.filter(b=>!b.entries.find(e=>e.date===TODAY));
  const el=document.getElementById('export-list');
  let html='';
  if(!beds.length){html='<div class="empty-state"><div class="empty-icon">📋</div><div>暂无床位数据</div></div>';}
  withRecord.forEach(b=>{
    const entry=b.entries.find(e=>e.date===TODAY);
    const pending=entry.orders.filter(o=>!o.done).length;
    const done=entry.orders.filter(o=>o.done).length;
    html+=`<div class="export-card" onclick="openExport(${b.id},{stopPropagation:()=>{}})">
      <div class="export-card-top">
        <span class="tag ${riskTagCls(b.risk)}">${b.num}床</span>
        <span class="export-card-name">${escHtml(b.name)}</span>
        <span class="tag tag-b" style="margin-left:auto;">查看导出</span>
      </div>
      <div class="export-card-meta">${escHtml(b.diag)}${b.age||b.gender?` · ${escHtml([b.age?b.age+'岁':null,b.gender].filter(Boolean).join('·'))}`:''} · 第${daysSince(b.admitDate)}天</div>
      ${b.chief?`<div class="export-card-meta" style="margin-top:3px;">主诉：${escHtml(b.chief)}</div>`:''}
      <div class="export-card-tags">
        ${pending?`<span class="tag tag-y">${pending}条待执行</span>`:''}
        ${done?`<span class="tag tag-g">${done}条已执行</span>`:''}
        ${!pending&&!done?`<span class="tag tag-gray">无医嘱</span>`:''}
      </div>
    </div>`;
  });
  if(noRecord.length){
    html+=`<div class="export-section-label">今日尚未记录</div>`;
    noRecord.forEach(b=>{
      html+=`<div class="no-record-card">
        <div class="no-record-info">
          <div class="no-record-name">${escHtml(b.num)}床 ${escHtml(b.name)}</div>
          <div class="no-record-sub">${escHtml(b.diag)}${b.chief?' · '+escHtml(b.chief):''}</div>
        </div>
        <div style="display:flex;gap:7px;">
          <button class="action-btn" onclick="openExport(${b.id},{stopPropagation:()=>{}})">导出</button>
          <button class="action-btn primary" onclick="openNoteNew(${b.id},{stopPropagation:()=>{}})">+ 记录</button>
        </div>
      </div>`;
    });
  }
  el.innerHTML=html;
}

function renderAll(){renderBeds();updateStats();syncViewSwitch();}
renderAll();

function refreshIfDayChanged(){
  const t=localDateStr(new Date());
  if(t!==TODAY){
    TODAY=t;
    renderAll();
    if(currentTab==='export') renderExport();
    if(currentTab==='todo') renderTodo();
  }
}
setInterval(refreshIfDayChanged,60000);
document.addEventListener('visibilitychange',refreshIfDayChanged);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
